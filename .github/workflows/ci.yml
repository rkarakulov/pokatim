name: ci

on:
  pull_request:
  push:
    branches: [main]
  # push в develop проверяется здесь же, но первым шагом деплоя (deploy-dev.yml вызывает этот workflow; вызывающий
  # даёт contents/packages/pull-requests: read); PR в develop — событием pull_request
  workflow_call:

# github.workflow в вызванном workflow — имя вызывающего: прогон из деплоя не отменяет обычный CI той же ветки
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# пакеты @rkarakulov/* читаются из GitHub Packages токеном GITHUB_TOKEN: доступ репозитория открывается
# в настройках каждого пакета (Manage Actions access, docs/runbooks/local-dev.md).
# Сторонние actions закреплены по SHA (тег — в комментарии).
permissions:
  contents: read
  packages: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action на событии PR читает список коммитов PR
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # completion gate (format, lint, arch:check, typecheck, test — AGENTS.md §3) — параллельными джобами: статика и
  # сборка (`static`), тесты API шардами (`test-api`), тесты остальных пакетов (`test-other`); `check` — их сводка
  # (одна обязательная проверка, как раньше). Локально — тот же `pnpm check`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # пользовательский .npmrc с токеном из NODE_AUTH_TOKEN для @rkarakulov/*
          registry-url: https://npm.pkg.github.com
          scope: '@rkarakulov'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm arch:check
      - run: pnpm typecheck
      # все приложения и пакеты (api, admin, packages/*); web-экспорт apps/app — job `web`
      - run: pnpm build
      # dist API — CommonJS поверх ESM-пакетов базы (require(esm)): typecheck и vitest
      # этого не видят, поэтому модули dist загружаются отдельно
      - name: api dist loads
        working-directory: apps/api
        run: node -e "require('reflect-metadata');require('./dist/app.module');require('./dist/worker.module')"

  # тесты API — на реальных MongoDB (replica set, шаг ниже) и Redis (.claude/rules/tests.md). Интеграционные файлы
  # идут по очереди на общей БД — поэтому шардами по файлам (vitest --shard), у каждого шарда свои MongoDB и Redis
  test-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test-api (${{ matrix.shard }}/3)
    services:
      redis:
        image: redis:8.8
        ports: ['6379:6379']
    env:
      MONGO_URL_TEST: mongodb://127.0.0.1:27017/pokatim_test?directConnection=true
      REDIS_URL_TEST: redis://127.0.0.1:6379/1
    steps:
      # MongoDB стартует до установки зависимостей (параллельно с ней); готовность — шагом replica set ниже
      - name: mongodb start
        # ядро раннера ≥ 6.19: mongod 8.0 (TCMalloc + rseq) не стартует — SERVER-121912; обход — rseq glibc
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            mongo:8.0 --replSet rs0 --bind_ip_all
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rkarakulov'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # MongoDB replica set (services не принимают command): rs.initiate, ожидание PRIMARY
      - name: mongodb replica set
        run: |
          initiate="try { rs.status().myState } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); 0 }"
          for _ in $(seq 1 60); do
            if [ "$(docker exec mongo mongosh --quiet --eval "$initiate" 2>/dev/null || true)" = "1" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::MongoDB replica set не стал PRIMARY за 60 с"
          docker logs --tail 30 mongo
          exit 1
      - run: pnpm --filter @pokatim/api exec vitest run --shard=${{ matrix.shard }}/3

  # тесты остальных пакетов (app — jest, admin и packages/* — vitest); БД не нужны
  test-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rkarakulov'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm turbo run test --filter='!@pokatim/api'

  # сводная проверка: зелёная, только если зелёные все части (пропуск или отмена части — тоже провал)
  check:
    if: always()
    needs: [static, test-api, test-other]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.static.result }} ${{ needs.test-api.result }} ${{ needs.test-other.result }}
        run: |
          for r in ${RESULTS}; do
            [ "${r}" = success ] || { echo "::error::часть check не прошла: static test-api test-other = ${RESULTS}"; exit 1; }
          done

  # web/PWA: production-сборка (SSR) и Playwright-смоук в браузере — Google Chrome с ubuntu-latest
  # (без загрузки браузеров Playwright). API шаблон не поднимает: экраны с данными показывают «Нет соединения».
  # Смоук с API — проектом: серверы — apps/app/e2e/project.ts, здесь — services, env (E2E_API=1, окружение API) и
  # подготовка (сборка API, миграции) в отмеченных местах; `pnpm e2e:web` передаёт окружение job целиком
  # pokatim: регистрация → письмо (Mailpit) → подтверждение → вход → перезагрузка (cookie сессии); Главная с данными
  # через API панели (CLI grant-admin из dist, e2e/home-fixture.ts)
  web:
    runs-on: ubuntu-latest
    # проект: services (Redis, …; MongoDB — шагом, как в test-api) для серверов смоука — здесь
    services:
      redis:
        image: redis:8.8
        ports: ['6379:6379']
      mailpit:
        image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ['1025:1025', '8025:8025']
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      PW_CHANNEL: chrome
      # проект: окружение смоука — ниже (только тестовые несекретные значения)
      E2E_API: '1'
      # окружение API и worker смоука: фиктивные несекретные значения (как apps/api/test/test-env.ts);
      # APP_LINK_BASE, CORS_ORIGINS и PORT задаёт apps/app/e2e/project.ts (origin-ы web-серверов смоука)
      MONGO_URL: mongodb://127.0.0.1:27017/pokatim?directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_URL: smtp://127.0.0.1:1025
      MAIL_FROM: 'pokatim <no-reply@pokatim.test>'
      JWT_SECRET: e2e-jwt-secret-e2e-jwt-secret-00000
      EMAIL_TOKEN_SECRET: e2e-email-secret-e2e-email-secret-0
      RATE_LIMIT_KEY_SECRET: e2e-rate-limit-secret-e2e-rate-limit-0
      AGREEMENT_VERSION: e2e-agreement
    steps:
      - name: mongodb start
        # ядро раннера ≥ 6.19: mongod 8.0 (TCMalloc + rseq) не стартует — SERVER-121912; обход — rseq glibc
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 -e GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            mongo:8.0 --replSet rs0 --bind_ip_all
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rkarakulov'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # проект: подготовка серверов смоука (сборка API, миграции) — шаги здесь
      # pokatim: MongoDB replica set для API смоука — как в test-api (старт — до установки зависимостей)
      - name: mongodb replica set
        run: |
          initiate="try { rs.status().myState } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); 0 }"
          for _ in $(seq 1 60); do
            if [ "$(docker exec mongo mongosh --quiet --eval "$initiate" 2>/dev/null || true)" = "1" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::MongoDB replica set не стал PRIMARY за 60 с"
          docker logs --tail 30 mongo
          exit 1
      # pokatim: API и worker смоука — из dist (с пакетами, от которых зависят); схема БД — миграции, как в деплое
      - run: pnpm turbo run build --filter=@pokatim/api
      - run: pnpm --filter @pokatim/api db:migrate
      # e2e:web зависит от build:web (turbo): export web + service worker, затем Playwright
      - run: pnpm e2e:web
      # pokatim: смоук панели «Протокол» (AC15 admin-01) на тех же API-окружении, MongoDB, Redis и Mailpit — свой
      # процесс API (порт 3101), `vite preview` под /admin/ с CSP панели, CLI grant-admin из dist
      - run: pnpm e2e:admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/app/test-results/
            apps/admin/test-results/
          retention-days: 7

  # Репетиция обновления dev-стенда (infra/deploy/rehearsal.sh): образы собираются локально на раннере, стек — сначала
  # из базовой ветки PR, затем новый deploy.sh поверх; свой compose project, без registry и nginx. Только PR,
  # меняющие деплой, образ, API или workflow; в вызове из деплоя (push) не запускается.
  deploy-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      POKATIM_PROJECT: pokatim-rehearsal
      POKATIM_TAG: rehearsal
      POKATIM_IMAGE_PREFIX: rehearsal/pokatim
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: затронуты деплой, образ, API или workflow?
        id: changes
        run: |
          if git diff --name-only "${BASE_REF}...HEAD" |
            grep -qE '^(infra/deploy/|infra/docker/|apps/api/|\.github/workflows/)'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::деплой, образ, API и workflow не менялись — репетиция пропущена"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.run == 'true'
      - name: образ api (локально)
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          load: true
          tags: ${{ env.POKATIM_IMAGE_PREFIX }}-api:${{ env.POKATIM_TAG }}
          secrets: NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=pokatim-api
      - name: образ web (локально)
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: web
          load: true
          tags: ${{ env.POKATIM_IMAGE_PREFIX }}-web:${{ env.POKATIM_TAG }}
          build-args: EXPO_PUBLIC_API_URL=https://rehearsal.pokatim.test
          secrets: NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=pokatim-web
      - name: образ admin (локально)
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: admin
          load: true
          tags: ${{ env.POKATIM_IMAGE_PREFIX }}-admin:${{ env.POKATIM_TAG }}
          secrets: NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=pokatim-admin
      # лог — шаги и проверки без значений секретов (rehearsal.sh сравнивает хеши строк .env)
      - name: репетиция обновления, повторного и упавшего деплоя
        if: steps.changes.outputs.run == 'true'
        run: bash infra/deploy/rehearsal.sh
