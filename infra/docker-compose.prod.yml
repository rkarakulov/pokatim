# Прод: одна VPS (hoster.by), Docker Compose, без Kubernetes.
# Секреты — в infra/.env на сервере (не в git). Заготовка: схема как у dev-стенда (infra/deploy, ADR-0007) —
# MongoDB replica set с keyfile и пользователем приложения; набор и пользователи — infra/deploy/mongo-init.js.
# Миграции — отдельным шагом деплоя:
#   docker compose run --rm api node apps/api/dist/db/migrate.js
name: pokatim
services:
  caddy:
    image: caddy:2
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - admin-dist:/srv/admin:ro
      - caddy-data:/data
    depends_on: [api, web]
    restart: unless-stopped
  api:
    image: ghcr.io/rkarakulov/pokatim-api:${APP_VERSION:-latest}
    command: ['node', 'apps/api/dist/main.js']
    env_file: .env
    depends_on: [mongo, redis]
    restart: unless-stopped
  worker:
    image: ghcr.io/rkarakulov/pokatim-api:${APP_VERSION:-latest}
    command: ['node', 'apps/api/dist/worker.js']
    env_file: .env
    depends_on: [mongo, redis]
    restart: unless-stopped
  # web/PWA с SSR (expo-server, apps/app/server) — то же приложение, что iOS/Android (ADR-0003)
  web:
    image: ghcr.io/rkarakulov/pokatim-web:${APP_VERSION:-latest}
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      EXPO_PUBLIC_API_URL: https://${PUBLIC_HOST}
      API_INTERNAL_URL: http://api:3000
      WEB_ORIGIN: https://${PUBLIC_HOST}
    depends_on: [api]
    restart: unless-stopped
  # single-node replica set (транзакции, outbox); keyfile — ./mongo-keyfile (600), копия с владельцем mongodb
  mongo:
    image: mongo:8.0
    entrypoint:
      - bash
      - -ec
      - install -m 400 -o mongodb -g mongodb /run/pokatim/mongo-keyfile /data/configdb/keyfile; exec docker-entrypoint.sh "$$@"
      - mongo-entrypoint
    command:
      [
        'mongod',
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/data/configdb/keyfile',
        '--wiredTigerCacheSizeGB',
        '0.5',
      ]
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./mongo-keyfile:/run/pokatim/mongo-keyfile:ro
    restart: unless-stopped
  redis:
    image: redis:8.8
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    restart: unless-stopped
volumes:
  mongodata:
  mongoconfig:
  redisdata:
  caddy-data:
  admin-dist:
