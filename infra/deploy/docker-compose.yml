# Dev-сервер (общий EC2): стек pokatim из образов GHCR, docs/runbooks/deploy.md.
# Кладётся деплоем в ${POKATIM_DIR:-~/pokatim}/docker-compose.yml; переменные — из .env рядом (bootstrap.sh,
# секреты генерируются на сервере). Запуск — deploy.sh: compose project pokatim-dev, --env-file .env.
# Наружу ничего: MongoDB, Redis, SMTP — только сеть проекта; api/web/admin и UI Mailpit — 127.0.0.1
# (перед ними nginx хоста; UI Mailpit — под паролем). Сервер общий: порты хоста выбраны свободными, перед
# сменой — `ss -ltnp`.
# общий диск: ротация логов каждого контейнера (на сервере нет log-opts в daemon.json)
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-api-env: &api-env
  NODE_ENV: production
  PORT: '3000'
  # тег образа — в ответе /v1/health (version)
  APP_VERSION: ${POKATIM_TAG:?}
  # пользователь приложения (readWrite только на БД pokatim, Q1); пароль — hex из .env (без экранирования в URL)
  MONGO_URL: &mongo-url mongodb://pokatim:${MONGO_PASSWORD:?}@mongo:27017/pokatim?replicaSet=rs0&authSource=pokatim
  REDIS_URL: redis://redis:6379
  # один прокси перед API — nginx хоста: берётся адрес клиента, который он записал в X-Forwarded-For
  TRUST_PROXY: ${TRUST_PROXY:-1}
  JWT_SECRET: ${JWT_SECRET:?}
  EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:?}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:?}
  APP_LINK_BASE: ${APP_LINK_BASE:?}
  AGREEMENT_VERSION: ${AGREEMENT_VERSION:?}
  # web и API — один origin за прокси: CORS выключен
  CORS_ORIGINS: ''

x-api-image: &api-image ${POKATIM_IMAGE_PREFIX:-ghcr.io/rkarakulov/pokatim}-api:${POKATIM_TAG:?}

services:
  # MongoDB 8.0 single-node replica set (транзакции и outbox работают только на RS, ADR-0007). Член набора —
  # mongo:27017 (адрес сервиса в сети проекта). Доступ — keyfile + пользователи (Q1): keyfile генерирует bootstrap.sh
  # (${POKATIM_DIR}/mongo-keyfile, 600), обёртка entrypoint копирует его в том mongoconfig с владельцем mongodb и 400
  # (mongod не принимает файл, читаемый другими). Набор rs0, root и пользователя приложения создаёт deploy.sh
  # (mongo-init.js: localhost exception на пустой БД, дальше — вход root). Healthcheck — `hello` без входа: PRIMARY.
  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    entrypoint:
      - bash
      - -ec
      - install -m 400 -o mongodb -g mongodb /run/pokatim/mongo-keyfile /data/configdb/keyfile; exec docker-entrypoint.sh "$$@"
      - mongo-entrypoint
    # кэш WiredTiger явно: по умолчанию — половина памяти хоста за вычетом 1 ГБ, а не лимита контейнера
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /data/configdb/keyfile
      - --wiredTigerCacheSizeGB
      - '0.25'
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - type: bind
        source: ./mongo-keyfile
        target: /run/pokatim/mongo-keyfile
        read_only: true
        bind: { create_host_path: false }
    # mongosh — отдельный процесс Node (~100 МБ) в лимите контейнера: проверка раз в 15 с, не чаще
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--norc',
          '--eval',
          'quit(db.hello().isWritablePrimary ? 0 : 1)',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # бюджет стека на общем сервере — 2560m: mongo 640 + redis 320 + mailpit 128 + api 512 + worker 384 + web 512 +
    # admin 64; mongod — кэш 0,25 ГБ + служебная память, запас — на mongosh healthcheck и deploy.sh
    deploy: { resources: { limits: { memory: 640m } } }
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.8@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
    # очереди BullMQ: noeviction (ключи задач не вытесняются), maxmemory ниже лимита контейнера — при заполнении
    # запись получает ошибку OOM от Redis, а не kill контейнера (запас — на fork перезаписи AOF)
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 320m } } }
    restart: unless-stopped
    logging: *logging

  # почта dev: все письма — в Mailpit; наружу (relay через внешний SMTP: SES, Gmail) — по MAIL_RELAY_RECIPIENTS:
  # точным адресам (bootstrap.sh собирает якорную регулярку MAILPIT_RELAY_MATCHING) или всем («*» →
  # MAILPIT_RELAY_ALL=true); relay выключен — конфиг не передаётся. UI — 127.0.0.1 хоста, снаружи — nginx
  # https://<хост>/mail/ под basic-auth самого Mailpit (письма = ссылки подтверждения), runbook «Почта»
  mailpit:
    image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_MAX_MESSAGES: '500'
      # UI и API под /mail/ (healthcheck образа /mailpit readyz учитывает webroot)
      MP_WEBROOT: /mail/
      # basic-auth UI и API: пользователь dev, пароль — секрет .env (bootstrap.sh, hex без ':' и пробелов)
      MP_UI_AUTH: dev:${MAILPIT_UI_PASSWORD:?}
      # relay: SMTP, логин и пароль — в файле (не в env контейнера); значения ниже вычисляет bootstrap.sh.
      # REV — хеш файла: его смена пересоздаёт контейнер
      MP_SMTP_RELAY_CONFIG: ${MAILPIT_RELAY_CONFIG:-}
      MP_SMTP_RELAY_ALL: ${MAILPIT_RELAY_ALL:-false}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_MATCHING:-}
      POKATIM_RELAY_REV: ${MAILPIT_RELAY_REV:-}
    volumes:
      - type: bind
        source: ./mailpit-relay.yml
        target: /etc/mailpit/relay.yml
        read_only: true
        bind: { create_host_path: false }
    ports: ['127.0.0.1:${POKATIM_MAIL_UI_PORT:-8125}:8025']
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped
    logging: *logging

  # миграции — отдельный одноразовый шаг деплоя (AGENTS.md §4.6): docker compose run --rm migrate
  migrate:
    image: *api-image
    profiles: [migrate]
    command: ['node', 'dist/db/migrate.js']
    environment:
      MONGO_URL: *mongo-url
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    image: *api-image
    command: ['node', 'dist/main.js']
    environment: *api-env
    ports: ['127.0.0.1:${POKATIM_API_PORT:-3100}:3000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped
    logging: *logging

  worker:
    image: *api-image
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 384m } } }
    restart: unless-stopped
    logging: *logging

  # web/PWA с SSR (ADR-0003): / сайта
  web:
    image: ${POKATIM_IMAGE_PREFIX:-ghcr.io/rkarakulov/pokatim}-web:${POKATIM_TAG:?}
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      EXPO_PUBLIC_API_URL: ${WEB_ORIGIN:?}
      API_INTERNAL_URL: http://api:3000
      WEB_ORIGIN: ${WEB_ORIGIN:?}
    ports: ['127.0.0.1:${POKATIM_WEB_PORT:-8180}:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/register').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped
    logging: *logging

  # панель «Протокол»: статика под /admin/
  admin:
    image: ${POKATIM_IMAGE_PREFIX:-ghcr.io/rkarakulov/pokatim}-admin:${POKATIM_TAG:?}
    ports: ['127.0.0.1:${POKATIM_ADMIN_PORT:-8181}:8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/admin/']
      interval: 10s
      timeout: 5s
      retries: 6
    deploy: { resources: { limits: { memory: 64m } } }
    restart: unless-stopped
    logging: *logging

volumes:
  mongodata:
  mongoconfig:
  redisdata:
