# Статика панели «Протокол» (сборка с base /admin/). TLS, сжатие и /v1 — на обратном прокси перед контейнером.
# Заголовки безопасности (task admin-01 §8.3): строгий CSP — скрипты, стили, шрифты и запросы только своего origin;
# inline — только <style> дизайн-системы (installDesignSystem), поэтому style-src 'unsafe-inline'. add_header в
# location заменяет заголовки сервера целиком — набор повторяется в каждом location.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # за обратным прокси: редиректы относительные, без внутреннего хоста и порта
    absolute_redirect off;

    set $panel_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    add_header Content-Security-Policy $panel_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /admin {
        add_header Content-Security-Policy $panel_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        return 301 /admin/;
    }

    # хешированные бандлы Vite — навсегда
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $panel_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html и маршруты SPA — не кешируются (после деплоя — сразу новая сборка)
    location /admin/ {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $panel_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}
