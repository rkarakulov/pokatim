# Статика панели «Протокол» (сборка с base /admin/). TLS, сжатие и /v1 — на обратном прокси перед контейнером.
# Заголовки безопасности (task admin-01 §8.3): строгий CSP — скрипты, стили, шрифты и запросы только своего origin;
# inline — только <style> дизайн-системы (installDesignSystem), поэтому style-src 'unsafe-inline'. add_header в
# location заменяет заголовки сервера целиком — набор повторяется в каждом location.
# Карта маршрута (routes-05, ADR-0014): стиль, тайлы, глифы и спрайты — origin провайдера в connect-src (тот же, что
# VITE_MAP_STYLE_LIGHT сборки; смена провайдера = env + эта строка, сторож — тест admin csp.test.ts); воркер MapLibre —
# свой ассет (/admin/assets/…) или blob: (worker-src); растры спрайтов — blob: (img-src).
# Камера сканера check-in (event-tickets PR C): Permissions-Policy — камера только своему origin, остальные устройства
# выключены; MediaStream в <video> и кадры canvas CSP не затрагивают (сторож — csp.test.ts).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # за обратным прокси: редиректы относительные, без внутреннего хоста и порта
    absolute_redirect off;

    set $panel_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://tiles.openfreemap.org; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    set $panel_permissions "camera=(self), microphone=(), geolocation=(), payment=(), usb=()";

    add_header Content-Security-Policy $panel_csp always;
    add_header Permissions-Policy $panel_permissions always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /admin {
        add_header Content-Security-Policy $panel_csp always;
        add_header Permissions-Policy $panel_permissions always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        return 301 /admin/;
    }

    # воркер MapLibre (routes-05) — модульный (`new Worker(url, { type: 'module' })`): браузер требует JavaScript MIME,
    # а с nosniff `application/octet-stream` не исполнит. `.mjs` в mime.types образа может не быть — тип задан явно
    # (regex-location важнее префиксного /admin/assets/; `types {}` — только default_type для этих файлов)
    location ~ ^/admin/assets/.+\.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $panel_csp always;
        add_header Permissions-Policy $panel_permissions always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # хешированные бандлы Vite — навсегда
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $panel_csp always;
        add_header Permissions-Policy $panel_permissions always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html и маршруты SPA — не кешируются (после деплоя — сразу новая сборка)
    location /admin/ {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $panel_csp always;
        add_header Permissions-Policy $panel_permissions always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}
