packages:
  - apps/*
  - packages/*

# Expo/Metro надёжнее работает с плоским node_modules
nodeLinker: hoisted

# пакеты базы публикует автор (app-foundation, ADR-0004): свежие по определению; чужие — без исключений
minimumReleaseAgeExclude:
  - '@rkarakulov/*'

catalog:
  # tooling
  typescript: ~6.0.3
  typescript-eslint: ^8.72.0
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  eslint-config-expo: ~58.0.4
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.13.0
  prettier: ^3.9.10
  turbo: ^2.11.10
  dependency-cruiser: ^18.7.0
  vitest: ^5.0.5
  '@types/node': ^24.19.2
  tsx: ^4.23.15
  # shared runtime
  zod: ^4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  '@tanstack/react-query': ^5.104.5
  '@fontsource/inter': ^5.3.0
  '@fontsource/playfair-display': ^5.3.0
  # тесты UI в DOM: web-проект jest приложения (react-native-web) и admin
  '@testing-library/react': ^16.3.3
  # смоук web в браузере; версия = ревизия браузера Playwright — точно
  '@playwright/test': 1.64.1
  # backend
  '@nestjs/common': ^12.2.0
  '@nestjs/core': ^12.2.0
  '@nestjs/platform-fastify': ^12.2.0
  '@nestjs/testing': ^12.2.0
  '@nestjs/bullmq': ^12.0.0
  bullmq: ^6.4.0
  ioredis: ^6.0.0
  mongodb: ^7.7.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  unplugin-swc: ^2.0.0
  '@swc/core': ^1.16.18
  # база app-foundation (ADR-0004): точная версия, обновление — `copier update` (версия приходит из шаблона)
  '@rkarakulov/config': 0.4.1
  '@rkarakulov/api-kit': 0.4.1
  '@rkarakulov/test-kit': 0.4.1
  '@rkarakulov/contracts-core': 0.4.1
  '@rkarakulov/api-client-core': 0.4.1
  '@rkarakulov/i18n-core': 0.4.1
  '@rkarakulov/design-tokens': 0.4.1
  '@rkarakulov/ui': 0.4.1

# драйверы БД — необязательные peer пакетов базы, но GitHub Packages не отдаёт peerDependenciesMeta в метаданных
# реестра, и pnpm ставит их как обязательные. Драйвер другой БД проекту не нужен
packageExtensions:
  '@rkarakulov/api-kit':
    peerDependenciesMeta:
      pg: { optional: true }
      drizzle-orm: { optional: true }
  '@rkarakulov/test-kit':
    peerDependenciesMeta:
      pg: { optional: true }
      drizzle-orm: { optional: true }

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
